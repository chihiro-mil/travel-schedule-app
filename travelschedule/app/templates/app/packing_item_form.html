{% load static %}
{% load tz %}
{% load custom_filters %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>packing item form page</title>
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static "app/flatpickr/flatpickr.min.css" %}">
    <script src="{% static 'app/flatpickr/flatpickr.min.js' %}"></script>
    <script src="{% static 'app/flatpickr/ja.js' %}"></script>
    <script src="{% static 'app/flatpickr-yearSelect/flatpickr-year-select-plugin.js' %}"></script>
</head>
<body>

    <div class="packing-item-form-header-area">
        <a href="{% url 'app:packing_item_list' schedule.id %}"class="back-button">＜戻る</a>

        <h1 class="packing-item-form-title">
            {{ page_title }}
        </h1>
    </div>

    <form method="post" class="packing-item-form">
        {% csrf_token %}
        <div class="packing-item-form-group">
            {{ form.name.label }}
            {{ form.name }}
            {{ form.name.errors }}
        </div>
        
        <div class="packing-item-form-group">
            {{ form.memo.label }}
            {{ form.memo }}
            {{ form.memo.errors }}
        </div>
        
        <div class="packing-item-form-button-area">
            <button type="submit" class="packing-item-form-button">
            保存
            </button>
        </div>
    </form>
    



    <footer class="footer-nav">
        <ul>
            <li>
                <a href="{% url 'app:home' %}">
                    <span class="footer-icon-label">
                        <i class="fas fa-home"></i><br>ホーム
                    </span>
                </a>
            </li>
            <li>
                <a href="{% url 'app:packing_item_create_or_edit' schedule.id %}">
                    <span class="footer-icon-label">
                        <i class="fas fa-plus-square"></i><br>持ち物追加
                    </span>
                </a>
            </li>
            <li>
                <a href="{% url 'app:mypage' %}">
                    <span class="footer-icon-label">
                        <i class="fas fa-user-cog"></i><br>マイページ設定
                    </span>
                </a>
            </li>
            <li>
                <a href="{% url 'app:logout' %}">
                    <span class="footer-icon-label">
                        <i class="fas fa-sign-out-alt"></i><br>ログアウト
                    </span>
                </a>
            </li>
        </ul>
    </footer>
</body>
